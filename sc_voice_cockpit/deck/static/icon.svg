<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Tablet Deck app icon: a tablet showing HUD keys and a quantum ring. Source for
       icon-180.png, icon-192.png and icon-512.png; everything sits inside the
       maskable safe zone (a circle of radius 205 around the centre). -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="80%">
      <stop offset="0" stop-color="#12253b"/>
      <stop offset="1" stop-color="#05090f"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g fill="none" stroke="#4fb3ff" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <rect x="100" y="140" width="312" height="232" rx="30" stroke-width="14"/>
    <rect x="138" y="178" width="104" height="66" rx="10" stroke-width="10"/>
    <rect x="138" y="268" width="104" height="66" rx="10" fill="#4fb3ff" fill-opacity=".35" stroke-width="10"/>
    <circle cx="324" cy="256" r="56" stroke-width="12"/>
    <path d="M324 200a56 56 0 0 1 56 56" stroke="#e8f4ff" stroke-width="12"/>
    <circle cx="324" cy="256" r="16" fill="#4fb3ff" stroke="none"/>
  </g>
</svg>
